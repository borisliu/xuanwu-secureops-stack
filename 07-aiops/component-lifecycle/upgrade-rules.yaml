schema_version: "0.1"
source_of_truth: git
priority:
  P0:
    conditions: [kev, cvss_critical_and_affected, internet_exposed_core_component]
    sla: "immediate review; task before next production window"
  P1:
    conditions: [critical_and_affected, high_and_affected_core_component]
    sla: "review within one business day"
  P2:
    conditions: [high_or_medium_and_affected_non_core_component]
    sla: "schedule in approved maintenance window"
  P3:
    conditions: [low, non_production, lifecycle_optimization]
    sla: "backlog and periodic review"

rules:
  - id: critical-fixed-version
    when: "affected == true and severity == Critical and fixed_version != null"
    set: { upgrade_required: true, minimum_priority: P1 }
    reason_codes: [CVE, CVSS_CRITICAL, SECURITY_PATCH]
  - id: high-fixed-version
    when: "affected == true and severity == High and fixed_version != null"
    set: { upgrade_required: true, minimum_priority: P2 }
    reason_codes: [CVE, SECURITY_PATCH]
  - id: kev
    when: "kev == true"
    set: { upgrade_required: review, minimum_priority: P0 }
    reason_codes: [KEV]
  - id: eol-eos
    when: "eol == true or eos == true"
    set: { upgrade_required: true, minimum_priority: P1 }
    reason_codes: [EOL]
  - id: not-affected
    when: "cve_count > 0 and affected == false"
    set: { upgrade_required: review }
    reason_codes: [POLICY]
    evidence_required: true
  - id: unknown-version
    when: "current_version == unknown or current_digest == unknown"
    set: { upgrade_required: review, risk: high }
    reason_codes: [POLICY]
    evidence_required: true

lifecycle:
  statuses: [discovered, assessed, upgrade-required, task-created, approved, executing, verifying, closed, rolled-back, review]
  forbidden_automatic_actions:
    - production_upgrade
    - kubernetes_minor_upgrade
    - kubernetes_major_upgrade
    - os_upgrade
    - cross_version_upgrade
    - rbac_or_network_policy_change
