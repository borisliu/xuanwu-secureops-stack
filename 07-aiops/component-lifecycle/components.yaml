schema_version: "0.1"
source_of_truth: git
components:
  - id: os.uos-server
    name: 统信服务器操作系统
    type: os
    owner: platform
    environment: [management, production]
    criticality: core-platform
    desired: { version: "V20 1060e", architecture: amd64, status: candidate, support_policy: "免费使用授权；不等同于官方认证组合、SLA 或商业支持承诺" }
    discovery: { method: [etc_os_release, uname, rpm_metadata], endpoint: node-local }
    lifecycle: { support_status: pending-validation, eol: unknown, eos: unknown }
    upgrade: { approval_required: true, status: planned }
  - id: platform.kubernetes
    name: Kubernetes
    type: platform
    owner: platform
    environment: [production]
    criticality: core-platform
    desired: { version: "1.30.6", status: candidate, support_policy: "KubeSphere 官方兼容矩阵 + 实际组合验证" }
    discovery: { method: [kubernetes_api, workload_images], endpoint: kubernetes-api }
    lifecycle: { support_status: pending-validation, eol: unknown, eos: unknown }
    upgrade: { approval_required: true, status: planned }
  - id: platform.kubesphere
    name: KubeSphere
