schema_version: "0.1"
source_of_truth: git

# 字段语义与权威来源声明（消除同名不同义）
field_semantics:
  component.upgrade:
    schema_authority: "07-aiops/component-lifecycle/upgrade-rules.yaml (upgrade_state_schema)"
    status_enum_authority: "07-aiops/component-lifecycle/upgrade-rules.yaml (lifecycle_statuses)"
    note: "本文件只提供初始值；运行态由 discovery 与 rules 写入受控 evidence artifact"
  component.lifecycle.support_status:
    enum: [pending-validation, supported, eol, eos, unknown]
    note: "组件支持状态，与 upgrade.status 是不同维度，不得混用"
  component.desired.status:
    authority: "09-implementation/VERSION-MATRIX.md（版本冻结状态）"
    enum: [candidate, validating, frozen, superseded]
    note: "版本冻结状态；不得与 upgrade.status 或 lifecycle.support_status 混用"
  component.upgrade.required:
    enum: [true, false, review]
    default_when_unknown: review
    note: "canonical 字段；upgrade_required 仅为其只读派生投影"

components:
  - id: os.uos-server
    name: 统信服务器操作系统
    type: os
    owner: platform
    environment: [management, production]
    criticality: core-platform
    desired: { version: "V20 1060e", architecture: amd64, status: candidate, support_policy: "免费使用授权；不等同于官方认证组合、SLA 或商业支持承诺" }
    discovery: { method: [etc_os_release, uname, rpm_metadata], endpoint: node-local }
    lifecycle: { support_status: pending-validation, eol: unknown, eos: unknown }
    upgrade: { required: review, approval_required: true, status: discovered }
  - id: platform.kubernetes
    name: Kubernetes
    type: platform
    owner: platform
    environment: [production]
    criticality: core-platform
    desired: { version: "1.30.6", status: candidate, support_policy: "KubeSphere 官方兼容矩阵 + 实际组合验证" }
    discovery: { method: [kubernetes_api, workload_images], endpoint: kubernetes-api }
    lifecycle: { support_status: pending-validation, eol: unknown, eos: unknown }
    upgrade: { required: review, approval_required: true, status: discovered }
